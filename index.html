<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消化器当番調整アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/japanese-holidays/lib/japanese-holidays.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    
    <!-- Firebase SDK (v11 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Firebaseの設定
        const firebaseConfig = {
            apiKey: "AIzaSyDPnNvsBesof9ZguJ_p37qaVTlwoYeZPN8",
            authDomain: "tmpu-gastro-qqcall.firebaseapp.com",
            projectId: "tmpu-gastro-qqcall",
            storageBucket: "tmpu-gastro-qqcall.firebasestorage.app",
            messagingSenderId: "466411946448",
            appId: "1:466411946448:web:b43063eafaeb6545aab9d5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // グローバルスコープにFirebaseの関数とdbインスタンスを公開
        window.firebaseDb = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseOnSnapshot = onSnapshot;
        window.firebaseGetDoc = getDoc;

        // Firebase準備完了イベントを発火
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        .sticky-col { position: sticky; left: 0; background-color: #ffffff; z-index: 10; box-shadow: inset -1px 0 0 #f1f5f9; }
        .sticky-head { position: sticky; top: 0; background-color: #f8fafc; z-index: 10; box-shadow: inset 0 -1px 0 #f1f5f9; }
        .sticky-cross { position: sticky; top: 0; left: 0; background-color: #f8fafc; z-index: 20; box-shadow: inset -1px -1px 0 #f1f5f9; }
        
        select.compact { -webkit-appearance: none; appearance: none; padding: 4px; text-align: center; width: 100%; cursor: pointer; background-color: transparent; border-radius: 4px; transition: all 0.2s; }
        select.compact:hover { background-color: rgba(0,0,0,0.03); }
        select.compact:focus { outline: none; background-color: #e0f2fe; box-shadow: 0 0 0 2px #bae6fd; }

        .toast-enter { opacity: 1; transform: translate(-50%, 0); }
        .toast-leave { opacity: 0; transform: translate(-50%, -20px); pointer-events: none; }
        
        /* =========================================
           PDF/Excel出力時のレイアウトおよび文字サイズ調整 
           ========================================= */
        .pdf-exporting { width: 2400px !important; max-width: none !important; border: none !important; box-shadow: none !important; border-radius: 0 !important; height: auto !important; background: #ffffff !important; }
        .pdf-exporting * { line-height: 1.5 !important; opacity: 1 !important; }
        
        .pdf-exporting .overflow-hidden { overflow: visible !important; }
        
        .pdf-exporting #calendar-header { padding-top: 32px !important; padding-bottom: 32px !important; border-bottom-width: 3px !important; }
        .pdf-exporting #calendar-header h2 { font-size: 64px !important; font-weight: 900 !important; color: #000 !important; }
        .pdf-exporting #calendar-header span { font-size: 32px !important; font-weight: 800 !important; padding: 12px 24px !important; border-width: 3px !important; color: #111 !important; border-color: #444 !important; }
        
        .pdf-exporting .calendar-scroll { overflow: visible !important; }
        .pdf-exporting #calendar-grid { 
            display: grid !important; 
            grid-template-columns: repeat(7, minmax(0, 1fr)) !important; 
            min-width: 2400px !important; 
            gap: 2px !important;
            background-color: #94a3b8 !important;
        }
        
        .pdf-exporting #calendar-grid > div {
            min-height: 300px !important;
            height: auto !important;
            overflow: visible !important;
            padding: 24px 20px !important;
            display: flex !important;
            flex-direction: column !important;
        }
        
        .pdf-exporting #calendar-grid > div.text-center {
            min-height: auto !important;
            padding: 20px 0 !important;
            font-size: 40px !important;
            font-weight: 900 !important;
        }

        .pdf-exporting .justify-end { justify-content: flex-start !important; } 

        .pdf-exporting .font-bold.text-base, .pdf-exporting .font-bold.md\:text-sm { font-size: 48px !important; font-weight: 900 !important; } 
        
        .pdf-exporting .text-rose-500.font-medium { font-size: 26px !important; font-weight: 800 !important; margin-top: 8px !important; }
        
        .pdf-exporting .md\:p-1\.5, .pdf-exporting .p-2 { 
            padding: 18px 20px !important; 
            margin-bottom: 16px !important; 
            min-height: 60px !important;
            height: auto !important;
            border-width: 3px !important;
        }

        .pdf-exporting .bg-amber-50 { background-color: #fffbeb !important; border-color: #f59e0b !important; }
        .pdf-exporting .bg-indigo-50 { background-color: #eef2ff !important; border-color: #6366f1 !important; }
        
        .pdf-exporting svg { width: 38px !important; height: 38px !important; flex-shrink: 0 !important; color: #000 !important; }
        
        .pdf-exporting .doc-main-name { 
            font-size: 42px !important; 
            font-weight: 900 !important; 
            margin-left: 12px !important; 
            line-height: 1.4 !important;
            padding-bottom: 4px !important;
            display: inline-block !important;
            color: #000 !important;
        }
        .pdf-exporting .doc-backup-name { 
            font-size: 28px !important; 
            font-weight: 800 !important; 
            margin-left: 50px !important; 
            margin-top: 10px !important; 
            line-height: 1.4 !important;
            padding-bottom: 2px !important;
            display: inline-block !important;
            color: #222 !important;
        }
        
        .pdf-exporting .mt-2.pt-1\.5.border-t .md\:text-\[10px\], .pdf-exporting .mt-2.pt-1\.5.border-t .text-xs { 
            font-size: 26px !important; 
            font-weight: 900 !important;
            padding: 12px 16px !important; 
            margin-bottom: 10px !important; 
            line-height: 1.4 !important;
            border-width: 3px !important;
            color: #000 !important;
        }

        .pdf-exporting .truncate { overflow: visible !important; text-overflow: clip !important; white-space: nowrap !important; }
        .pdf-exporting .whitespace-nowrap { white-space: nowrap !important; }

        .pdf-exporting .mobile-only { display: none !important; }
        .pdf-exporting .desktop-only { display: block !important; }
        .pdf-exporting .desktop-only-contents { display: contents !important; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 md:p-6 lg:p-8">

    <!-- トースト通知 -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 toast-leave flex items-center shadow-lg rounded-full px-6 py-3 font-medium text-sm backdrop-blur-md">
        <span id="toast-icon" class="mr-2"></span>
        <span id="toast-message"></span>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-shift-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <!-- ヘッダー -->
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span id="edit-modal-title">担当変更</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- タブボタン -->
            <div class="flex border-b border-slate-200">
                <button onclick="switchEditTab('direct')" id="tab-btn-direct" class="flex-1 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 bg-white">担当者を変更</button>
                <button onclick="switchEditTab('swap')" id="tab-btn-swap" class="flex-1 py-3 text-sm font-bold text-slate-500 border-b-2 border-transparent bg-slate-50 hover:bg-white transition-colors">日程を交換 (スワップ)</button>
            </div>

            <!-- タブコンテンツ: 直接変更 -->
            <div id="edit-tab-direct" class="p-5 overflow-y-auto">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase">1st (Main) 担当</label>
                        <select id="edit-main-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none bg-white shadow-sm transition-colors" onchange="checkEditBackupReq()">
                            <!-- JSで生成 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase flex justify-between">
                            <span>Backup 担当</span>
                            <span id="edit-backup-badge" class="text-[10px] bg-rose-100 text-rose-700 px-1.5 rounded hidden">必須</span>
                        </label>
                        <select id="edit-backup-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none bg-white shadow-sm transition-colors">
                            <!-- JSで生成 -->
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-lg transition-colors">キャンセル</button>
                    <button onclick="saveDirectEdit()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-lg shadow-sm transition-colors">変更を保存</button>
                </div>
            </div>

            <!-- タブコンテンツ: 日程交換 -->
            <div id="edit-tab-swap" class="p-5 overflow-y-auto hidden flex-col">
                <div class="mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <label class="block text-xs font-bold text-slate-600 mb-2">誰のシフトを交換しますか？</label>
                    <div class="flex gap-4">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="swap-role" value="main" class="text-indigo-600 focus:ring-indigo-500 w-4 h-4" onchange="renderSwapCandidates()" checked>
                            <span class="ml-2 text-sm text-slate-700 font-medium">1st (<span id="swap-main-name"></span>)</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer" id="swap-role-backup-container">
                            <input type="radio" name="swap-role" value="backup" class="text-indigo-600 focus:ring-indigo-500 w-4 h-4" onchange="renderSwapCandidates()">
                            <span class="ml-2 text-sm text-slate-700 font-medium">Backup (<span id="swap-backup-name"></span>)</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex-1 flex flex-col min-h-0">
                    <label class="block text-xs font-bold text-slate-600 mb-2 flex items-center justify-between">
                        <span>交換可能な日程候補</span>
                        <span class="text-[10px] text-slate-400 font-normal">※除外条件・要Backupを考慮</span>
                    </label>
                    <div id="swap-candidates-list" class="flex-1 overflow-y-auto border border-slate-200 rounded-lg bg-white p-2 space-y-2 max-h-60">
                        <!-- JSで生成 -->
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2">
                    <button onclick="closeEditModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-lg transition-colors">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto space-y-6">
        <header class="flex flex-col xl:flex-row justify-between items-center bg-white/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div class="flex flex-col items-center xl:items-start gap-2 w-full xl:w-auto">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md shadow-indigo-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">消化器当番調整アプリ</h1>
                </div>
                
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                    <button onclick="prevMonth()" class="p-2 sm:px-3 rounded-lg hover:bg-white hover:shadow-sm text-slate-600 transition-all flex items-center justify-center" title="前月">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <span id="current-month-display" class="font-bold text-[16px] sm:text-[17px] text-indigo-700 min-w-[110px] sm:min-w-[120px] text-center px-2 tracking-wide"></span>
                    <button onclick="nextMonth()" class="p-2 sm:px-3 rounded-lg hover:bg-white hover:shadow-sm text-slate-600 transition-all flex items-center justify-center" title="翌月">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </button>
                </div>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-xl shadow-inner w-full sm:w-auto overflow-x-auto no-scrollbar">
                <button onclick="switchTab('tab-schedule')" id="btn-tab-schedule" class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-2.5 text-xs sm:text-sm font-semibold rounded-lg bg-white text-indigo-700 shadow-sm transition-all whitespace-nowrap">スケジュール</button>
                <button onclick="switchTab('tab-settings')" id="btn-tab-settings" class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-50/50 transition-all whitespace-nowrap">月間設定</button>
                <button onclick="switchTab('tab-doctors')" id="btn-tab-doctors" class="tab-btn flex-1 sm:flex-none px-4 sm:px-6 py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-50/50 transition-all whitespace-nowrap">医師設定</button>
            </div>
        </header>

        <div id="tab-schedule" class="tab-content space-y-4 sm:space-y-6 fade-in">
            
            <div class="flex items-center gap-2 text-xs sm:text-sm text-slate-600 bg-indigo-50/50 p-3 sm:px-4 rounded-xl border border-indigo-100 shadow-sm">
                <svg class="w-5 h-5 text-indigo-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p>カレンダー内の名前をクリックすると、<span class="font-bold text-indigo-700">担当の直接変更</span>や<span class="font-bold text-indigo-700">他の日との担当交換（スワップ）</span>ができます。</p>
            </div>

            <div id="schedule-actions" class="flex flex-wrap justify-end gap-2 sm:gap-3">
                <button onclick="undo()" id="undo-btn-schedule" disabled class="px-3 sm:px-4 py-2.5 sm:py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-1 sm:gap-2 active:scale-95 opacity-50 cursor-not-allowed mr-auto">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                    <span class="hidden sm:inline">元に戻す</span>
                </button>
                <button onclick="resetSchedule()" class="px-3 sm:px-6 py-2.5 sm:py-3 bg-white border border-rose-200 hover:bg-rose-50 text-rose-600 text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-1 sm:gap-2 active:scale-95">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span id="reset-schedule-btn-text">月をリセット</span>
                </button>
                <button onclick="exportToPDF()" class="px-3 sm:px-6 py-2.5 sm:py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-1 sm:gap-2 active:scale-95">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PDF出力
                </button>
                <button onclick="exportToExcel()" class="px-3 sm:px-6 py-2.5 sm:py-3 bg-white border border-slate-200 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-1 sm:gap-2 active:scale-95">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Excel出力
                </button>
                <button onclick="generateSchedule()" class="group px-3 sm:px-6 py-2.5 sm:py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-1 sm:gap-2 active:scale-95">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">スケジュール</span>自動生成
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- カレンダー表示 -->
                <div id="calendar-export-area" class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden relative">
                    <div id="calendar-header" class="hidden px-4 sm:px-5 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                        <h2 class="font-bold text-lg text-slate-800" id="export-month-display"></h2>
                        <span class="text-xs sm:text-sm text-slate-500 font-medium bg-white px-3 py-1 rounded-lg border border-slate-200">消化器当番スケジュール</span>
                    </div>
                    <div class="calendar-scroll w-full">
                        <div id="calendar-grid" class="grid grid-cols-1 md:grid-cols-7 bg-slate-100 md:gap-[1px] md:min-w-[900px] lg:min-w-full">
                            <!-- JSで描画 -->
                        </div>
                    </div>
                </div>

                <!-- 集計表 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden self-start lg:sticky lg:top-6">
                    <div class="px-4 sm:px-5 py-3 sm:py-4 bg-slate-50/50 border-b border-slate-100 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <h2 class="font-bold text-sm sm:text-base text-slate-700">当番回数 集計</h2>
                    </div>
                    <div id="summary-container" class="overflow-x-auto max-h-[400px] lg:max-h-[600px] overflow-y-auto">

    <script>
        const DOCTOR_TYPES = {
            SOLO_BACKUP: 'solo_backup', 
            NEEDS_BACKUP: 'needs_backup', 
            BACKUP_ONLY: 'backup_only' 
        };

        const REASONS = [
            { val: '', label: '-' },
            { val: 'preferred', label: '⭐ 当番希望' },
            { val: 'er_night', label: '救急当直' },
            { val: 'er_day', label: '救急日直' },
            { val: 'vacation', label: '休暇' },
            { val: 'icu_day', label: 'ICU日直' },
            { val: 'icu_night', label: 'ICU当直' },
            { val: 'admin_day', label: '管理日直' },
            { val: 'admin_night', label: '管理当直' },
            { val: 'wakabayashi_day', label: '若林病院日直' },
            { val: 'wakabayashi_night', label: '若林病院当直' },
            { val: 'unavailable', label: '当番不可' },
            { val: 'day_unavailable', label: '昼当番不可' },
            { val: 'night_unavailable', label: '夜当番不可' }
        ];

        let defaultDoctorsData = [
            { id: 'doc_1', name: '及川', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_2', name: '大沼', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_3', name: '早川', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_4', name: '猪股', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_5', name: '宮下', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_6', name: '伊藤', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_7', name: '金', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_8', name: '片山', type: DOCTOR_TYPES.SOLO_BACKUP, limitShift: 4, limitBackup: 4 },
            { id: 'doc_9', name: '瓜田宗', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_10', name: '瓜田愛', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_11', name: '竹本', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_12', name: '木内', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_13', name: '田島', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_14', name: '巽', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_15', name: '齋藤', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_16', name: '八子', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_17', name: '山田(陽)', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_18', name: '福士', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
            { id: 'doc_19', name: '小岩井', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
            { id: 'doc_20', name: '吉野', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
        ];

        let doctors = [];
        let currentYear = 2026;
        let currentMonth = 9; 
        let daysInMonth = 30;
        
        let customHolidays = []; 
        let unavailability = {}; 
        let scheduleData = {};
        let counts = {};
        
        let prevMonthScheduleData = {};
        let prevMonthUnavailability = {};

        // 履歴管理用
        let historyStack = [];
        const MAX_HISTORY = 10;

        let toastTimeout;
        let unsubscribeMonth = null;
        let unsubscribeDoctors = null;
        
        // 編集モーダル用の状態管理
        let currentEditDay = null;
        let currentEditType = null;

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function getDayOfWeek(year, month, day) {
            const d = new Date(year, month - 1, day);
            return ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
        }

        function isHolidayDay(day) {
            const d = new Date(currentYear, currentMonth - 1, day);
            const dow = d.getDay();
            if (dow === 0 || dow === 6) return true;
            if (typeof JapaneseHolidays !== 'undefined' && JapaneseHolidays.isHoliday(d)) return true;
            if (customHolidays.includes(day)) return true;
            return false;
        }

        function getTypeLabel(type) {
            if (type === DOCTOR_TYPES.SOLO_BACKUP) return '<span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] sm:text-xs font-medium border border-indigo-100 whitespace-nowrap">単独・Backup可</span>';
            if (type === DOCTOR_TYPES.NEEDS_BACKUP) return '<span class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded-md text-[10px] sm:text-xs font-medium border border-emerald-100 whitespace-nowrap">要Backup</span>';
            if (type === DOCTOR_TYPES.BACKUP_ONLY) return '<span class="px-2 py-1 bg-amber-50 text-amber-700 rounded-md text-[10px] sm:text-xs font-medium border border-amber-100 whitespace-nowrap">Backupのみ</span>';
            return '';
        }

        function getDefaultLimits(type) {
            return {
                shift: (type === DOCTOR_TYPES.BACKUP_ONLY) ? 0 : 4,
                backup: (type === DOCTOR_TYPES.NEEDS_BACKUP) ? 0 : 4,
            };
        }

        function showMessage(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const messageEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            clearTimeout(toastTimeout);
            messageEl.innerHTML = msg;
            
            if (isError) {
                container.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 flex items-center shadow-lg rounded-full px-4 sm:px-6 py-2.5 sm:py-3 font-medium text-xs sm:text-sm backdrop-blur-md bg-rose-50 text-rose-700 border border-rose-200 toast-enter w-11/12 max-w-md';
                iconEl.innerHTML = '<svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            } else {
                container.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 flex items-center shadow-lg rounded-full px-4 sm:px-6 py-2.5 sm:py-3 font-medium text-xs sm:text-sm backdrop-blur-md bg-emerald-50 text-emerald-800 border border-emerald-200 toast-enter w-11/12 max-w-md';
                iconEl.innerHTML = '<svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }

            toastTimeout = setTimeout(() => {
                container.classList.remove('toast-enter');
                container.classList.add('toast-leave');
            }, 6000);
        }
        
        // --- Undo (元に戻す) ロジック ---
        function pushToHistory() {
            historyStack.push({
                scheduleData: JSON.parse(JSON.stringify(scheduleData)),
                counts: JSON.parse(JSON.stringify(counts)),
                unavailability: JSON.parse(JSON.stringify(unavailability)),
                customHolidays: JSON.parse(JSON.stringify(customHolidays))
            });
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
            updateUndoButton();
        }

        function undo() {
            if (historyStack.length === 0) return;
            const prevState = historyStack.pop();
            
            scheduleData = prevState.scheduleData;
            counts = prevState.counts;
            unavailability = prevState.unavailability;
            customHolidays = prevState.customHolidays;
            
            saveMonthData(); 
            
            renderCustomHolidays();
            renderUnavailabilityTable();
            renderCalendar();
            renderSummary();
            
            updateUndoButton();
            showMessage("1つ前の操作を取り消しました");
        }

        function updateUndoButton() {
            const btns = [document.getElementById('undo-btn-schedule'), document.getElementById('undo-btn-settings')];
            btns.forEach(btn => {
                if (!btn) return;
                if (historyStack.length === 0) {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.disabled = false;
                }
            });
        }
        // -------------------------------
        
        function generateId() {
            return 'doc_' + Math.random().toString(36).substr(2, 9);
        }

        function saveDoctors() {
            if(!window.firebaseSetDoc) return;
            const docRef = window.firebaseDoc(window.firebaseDb, 'settings', 'doctors');
            window.firebaseSetDoc(docRef, { list: doctors })
                .catch(err => console.error("Error saving doctors:", err));
        }

        function listenDoctors() {
            if(!window.firebaseOnSnapshot) return;
            if (unsubscribeDoctors) unsubscribeDoctors();
            
            const docRef = window.firebaseDoc(window.firebaseDb, 'settings', 'doctors');
            unsubscribeDoctors = window.firebaseOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    doctors = docSnap.data().list || [];
                    doctors.forEach(d => {
                        if (d.limitShift === undefined) d.limitShift = getDefaultLimits(d.type).shift;
                        if (d.limitBackup === undefined) d.limitBackup = getDefaultLimits(d.type).backup;
                    });
                } else {
                    doctors = JSON.parse(JSON.stringify(defaultDoctorsData));
                    saveDoctors();
                }
                renderDoctorsTable();
                renderUnavailabilityTable();
                renderSummary();
            }, err => console.error("Error listening doctors:", err));
        }

        function getMonthDataKey() {
            return `schedule_${currentYear}_${currentMonth}`;
        }

        async function fetchPrevMonthData() {
            if(!window.firebaseGetDoc || !window.firebaseDb) return;
            
            let pYear = currentYear;
            let pMonth = currentMonth - 1;
            if (pMonth < 1) {
                pMonth = 12;
                pYear--;
            }
            const docRef = window.firebaseDoc(window.firebaseDb, 'monthly_schedules', `schedule_${pYear}_${pMonth}`);
            try {
                const snap = await window.firebaseGetDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    prevMonthScheduleData = data.scheduleData || {};
                    prevMonthUnavailability = data.unavailability || {};
                } else {
                    prevMonthScheduleData = {};
                    prevMonthUnavailability = {};
                }
            } catch (e) {
                console.error("Error fetching prev month data:", e);
            }
        }

        function saveMonthData() {
            if(!window.firebaseSetDoc) return;
            const docRef = window.firebaseDoc(window.firebaseDb, 'monthly_schedules', getMonthDataKey());
            const data = {
                unavailability,
                customHolidays,
                scheduleData,
                counts
            };
            window.firebaseSetDoc(docRef, data)
                .catch(err => console.error("Error saving month data:", err));
        }

        function listenMonthData() {
            if(!window.firebaseOnSnapshot) return;
            if (unsubscribeMonth) unsubscribeMonth();
            
            unavailability = {};
            customHolidays = [];
            scheduleData = {};
            counts = {};
            
            const docRef = window.firebaseDoc(window.firebaseDb, 'monthly_schedules', getMonthDataKey());
            unsubscribeMonth = window.firebaseOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    unavailability = data.unavailability || {};
                    customHolidays = data.customHolidays || [];
                    scheduleData = data.scheduleData || {};
                    counts = data.counts || {};
                }
                renderCustomHolidays();
                renderUnavailabilityTable();
                renderCalendar();
                renderSummary();
            }, err => console.error("Error listening month data:", err));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
                el.classList.add('text-slate-500', 'hover:text-slate-700', 'hover:bg-slate-50/50');
            });
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('text-slate-500', 'hover:text-slate-700', 'hover:bg-slate-50/50');
            activeBtn.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
        }

        function updateMonthDisplayAndData() {
            document.getElementById('current-month-display').textContent = `${currentYear}年 ${currentMonth}月`;
            
            const resetScheduleBtnText = document.getElementById('reset-schedule-btn-text');
            if(resetScheduleBtnText) resetScheduleBtnText.textContent = `${currentMonth}月をリセット`;
            
            const resetSettingsBtnText = document.getElementById('reset-settings-btn-text');
            if(resetSettingsBtnText) resetSettingsBtnText.textContent = `${currentMonth}月をリセット`;

            daysInMonth = getDaysInMonth(currentYear, currentMonth);
            
            // 前月のデータを取得してから今月の監視を開始
            fetchPrevMonthData().then(() => {
                listenMonthData();
            });
        }

        function prevMonth() {
            historyStack = []; // 月をまたいだら履歴リセット
            updateUndoButton();
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            updateMonthDisplayAndData();
        }

        function nextMonth() {
            historyStack = []; // 月をまたいだら履歴リセット
            updateUndoButton();
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            updateMonthDisplayAndData();
        }
        
        function toggleCustomHoliday(day) {
            pushToHistory();
            const idx = customHolidays.indexOf(day);
            if (idx > -1) {
                customHolidays.splice(idx, 1);
            } else {
                customHolidays.push(day);
            }
            saveMonthData();
        }

        function updateUnavail(docId, day, val) {
            pushToHistory();
            if (!unavailability[docId]) unavailability[docId] = {};
            if (val === '') {
                delete unavailability[docId][day];
            } else {
                unavailability[docId][day] = val;
            }
            saveMonthData();
        }

        function updateDoctorLimit(docId, field, val) {
            const doc = doctors.find(d => d.id === docId);
            if (doc) {
                doc[field === 'shift' ? 'limitShift' : 'limitBackup'] = parseInt(val, 10) || 0;
                saveDoctors();
            }
        }
        
        function addDoctor() {
            const nameInput = document.getElementById('new-doc-name');
            const typeInput = document.getElementById('new-doc-type');
            const name = nameInput.value.trim();
            if (!name) {
                showMessage("氏名を入力してください", true);
                return;
            }
            
            const newDoc = {
                id: generateId(),
                name: name,
                type: typeInput.value,
                limitShift: getDefaultLimits(typeInput.value).shift,
                limitBackup: getDefaultLimits(typeInput.value).backup
            };
            
            doctors.push(newDoc);
            saveDoctors();
            
            nameInput.value = '';
            showMessage(`「${name}」を追加しました。`);
        }
        
        function removeDoctor(docId) {
            const doc = doctors.find(d => d.id === docId);
            if (!doc) return;
            if (!confirm(`「${doc.name}」を削除してもよろしいですか？`)) return;
            
            doctors = doctors.filter(d => d.id !== docId);
            saveDoctors();
            
            delete unavailability[docId];
            saveMonthData();
        }
        
        function moveDoctor(index, direction) {
            if (direction === -1 && index > 0) {
                const temp = doctors[index];
                doctors[index] = doctors[index - 1];
                doctors[index - 1] = temp;
                saveDoctors();
            } else if (direction === 1 && index < doctors.length - 1) {
                const temp = doctors[index];
                doctors[index] = doctors[index + 1];
                doctors[index + 1] = temp;
                saveDoctors();
            }
        }

        function resetSchedule() {
            if (Object.keys(scheduleData).length === 0) {
                showMessage('リセットするスケジュールがありません。');
                return;
            }
            if (!confirm(`【警告】\n${currentYear}年${currentMonth}月の「スケジュール割当」をすべて白紙に戻しますか？\n※除外日や休診日設定はそのまま残ります。`)) {
                return;
            }
            pushToHistory();
            scheduleData = {};
            counts = {};
            saveMonthData();
            showMessage(`${currentMonth}月のスケジュールをリセットしました。`);
        }

        function resetSettings() {
            if (Object.keys(unavailability).length === 0 && customHolidays.length === 0) {
                showMessage('リセットする設定がありません。');
                return;
            }
            if (!confirm(`【警告】\n${currentYear}年${currentMonth}月の「追加の休診日」と「除外日・不可条件」をすべて白紙に戻しますか？\n※スケジュール割当はそのまま残ります。`)) {
                return;
            }
            pushToHistory();
            unavailability = {};
            customHolidays = [];
            saveMonthData();
            showMessage(`${currentMonth}月の月間設定をリセットしました。`);
        }

        // 月間の回数をスケジュールデータから再計算する
        function recalcCounts() {
            doctors.forEach(d => {
                counts[d.id] = { shift: 0, backup: 0, weekdayShift: 0, holidayShift: 0 };
            });
            for (let d = 1; d <= daysInMonth; d++) {
                if (!scheduleData[d]) continue;
                const isHol = isHolidayDay(d);
                ['day', 'night'].forEach(type => {
                    if (scheduleData[d][type]) {
                        const m = scheduleData[d][type].main;
                        const b = scheduleData[d][type].backup;
                        if (m && m !== 'ERROR' && counts[m]) {
                            counts[m].shift++;
                            if (isHol) counts[m].holidayShift++;
                            else counts[m].weekdayShift++;
                        }
                        if (b && b !== 'ERROR' && counts[b]) {
                            counts[b].backup++;
                        }
                    }
                });
            }
        }

        // --- 手動変更・スワップ用の判定ロジック ---
        function isDoctorAvailableForSlot(doc, day, shiftType, isBackup, currentMainId) {
            if (isBackup && doc.id === currentMainId) return false;
            if (isBackup && doc.type === DOCTOR_TYPES.NEEDS_BACKUP) return false;
            if (!isBackup && doc.type === DOCTOR_TYPES.BACKUP_ONLY) return false;

            const reason = unavailability[doc.id]?.[day];
            if (reason) {
                if (['er_day', 'vacation', 'icu_day', 'icu_night', 'admin_day', 'admin_night', 'wakabayashi_day', 'wakabayashi_night', 'unavailable', 'er_night'].includes(reason)) return false;
                if (reason === 'day_unavailable' && shiftType === 'day') return false;
                if (reason === 'night_unavailable' && shiftType === 'night') return false;
            }

            if (day > 1) {
                // 救急当直の翌日は除外
                if (unavailability[doc.id]?.[day - 1] === 'er_night') return false;
                // 手動変更時は前日の消化器当番(連続日程)でも候補に含めるため、以下の条件を除外しない
            }
            if (day === 1) {
                const pYear = currentMonth === 1 ? currentYear - 1 : currentYear;
                const pMonth = currentMonth === 1 ? 12 : currentMonth - 1;
                const prevLastDay = getDaysInMonth(pYear, pMonth);
                // 救急当直の翌日は除外
                if (prevMonthUnavailability[doc.id]?.[prevLastDay] === 'er_night') return false;
                // 手動変更時は前日の消化器当番(連続日程)でも候補に含めるため、以下の条件を除外しない
            }
            return true;
        }

        function getAvailableDoctorsForSlot(day, shiftType, isBackup, currentMainId = null) {
            let available = [];
            let currentDocId = null;
            if (scheduleData[day] && scheduleData[day][shiftType]) {
                currentDocId = isBackup ? scheduleData[day][shiftType].backup : scheduleData[day][shiftType].main;
            }

            doctors.forEach(doc => {
                if (!isDoctorAvailableForSlot(doc, day, shiftType, isBackup, currentMainId)) return;

                let isOverLimit = false;
                let countObj = counts[doc.id] || {shift:0, backup:0};
                if (isBackup) {
                    if (countObj.backup >= doc.limitBackup && doc.id !== currentDocId) isOverLimit = true;
                } else {
                    if (countObj.shift >= doc.limitShift && doc.id !== currentDocId) isOverLimit = true;
                }

                available.push({ doc, isOverLimit });
            });
            return available;
        }

        function getSwapCandidates(day, type, role) {
            const currentDocId = scheduleData[day]?.[type]?.[role];
            if (!currentDocId || currentDocId === 'ERROR') return [];
            
            const docA = doctors.find(d => d.id === currentDocId);
            if (!docA) return [];

            let candidates = [];

            for (let d = 1; d <= daysInMonth; d++) {
                if (!scheduleData[d]) continue;
                ['day', 'night'].forEach(t => {
                    if (!scheduleData[d][t]) return;
                    if (d === day && t === type) return; 

                    const targetDocId = scheduleData[d][t][role];
                    if (!targetDocId || targetDocId === 'ERROR') return;
                    if (targetDocId === docA.id) return; 

                    const docB = doctors.find(doc => doc.id === targetDocId);
                    if (!docB) return;

                    const bCanGoA = isDoctorAvailableForSlot(docB, day, type, role === 'backup', role === 'backup' ? scheduleData[day][type].main : null);
                    const aCanGoB = isDoctorAvailableForSlot(docA, d, t, role === 'backup', role === 'backup' ? scheduleData[d][t].main : null);

                    if (!bCanGoA || !aCanGoB) return;

                    // 要Backup条件のチェック
                    if (role === 'main') {
                        const aBackup = scheduleData[day][type].backup;
                        if (docB.type === DOCTOR_TYPES.NEEDS_BACKUP && (!aBackup || aBackup === 'ERROR')) return;
                        
                        const bBackup = scheduleData[d][t].backup;
                        if (docA.type === DOCTOR_TYPES.NEEDS_BACKUP && (!bBackup || bBackup === 'ERROR')) return;
                    }

                    candidates.push({ day: d, type: t, role: role, doc: docB });
                });
            }
            return candidates;
        }

        // --- 自動生成ロジック ---
        function canAssignLocal(doctor, day, type, isBackup, currentSchedule, currentCounts) {
            if (isBackup) {
                if (currentCounts[doctor.id].backup >= doctor.limitBackup) return false;
            } else {
                if (currentCounts[doctor.id].shift >= doctor.limitShift) return false;
            }

            if (isBackup && doctor.type === DOCTOR_TYPES.NEEDS_BACKUP) return false;
            if (!isBackup && doctor.type === DOCTOR_TYPES.BACKUP_ONLY) return false;

            const reason = unavailability[doctor.id]?.[day];
            if (reason) {
                if (['er_day', 'vacation', 'icu_day', 'icu_night', 'admin_day', 'admin_night', 'wakabayashi_day', 'wakabayashi_night', 'unavailable'].includes(reason)) return false;
                if (reason === 'er_night') return false;
                if (reason === 'day_unavailable' && type === 'day') return false;
                if (reason === 'night_unavailable' && type === 'night') return false;
                // 'preferred' の場合はスキップ（問題なく割り当て可能）
            }
            if (day > 1 && unavailability[doctor.id]?.[day - 1] === 'er_night') return false;

            if (day > 1 && currentSchedule[day - 1]?.night) {
                const prevN = currentSchedule[day - 1].night;
                if (prevN.main === doctor.id || prevN.backup === doctor.id) return false;
            }

            if (day === 1) {
                const pYear = currentMonth === 1 ? currentYear - 1 : currentYear;
                const pMonth = currentMonth === 1 ? 12 : currentMonth - 1;
                const prevLastDay = getDaysInMonth(pYear, pMonth);
                
                if (prevMonthUnavailability[doctor.id]?.[prevLastDay] === 'er_night') return false;
                
                if (prevMonthScheduleData[prevLastDay]?.night) {
                    const prevN = prevMonthScheduleData[prevLastDay].night;
                    if (prevN.main === doctor.id || prevN.backup === doctor.id) return false;
                }
            }
            return true;
        }

        function getCandidateScore(doc, day, isHolidayShift, isBackup, currentCounts, currentSchedule) {
            let score = 0;
            
            // 当番希望を出している場合は圧倒的な高スコアを付与
            if (unavailability[doc.id]?.[day] === 'preferred') {
                score += 5000;
            }
            
            const count = isBackup ? currentCounts[doc.id].backup : currentCounts[doc.id].shift;
            const limit = isBackup ? doc.limitBackup : doc.limitShift;
            const remain = limit - count;

            score += remain * 10;
            if (limit > 0 && count === 0) score += 1000; 

            if (!isBackup) {
                if (doc.type === DOCTOR_TYPES.NEEDS_BACKUP) score += 500;
                const typeShift = isHolidayShift ? currentCounts[doc.id].holidayShift : currentCounts[doc.id].weekdayShift;
                score -= typeShift * 20;
            }

            if (day < daysInMonth) {
                if (unavailability[doc.id]?.[day + 1] === 'vacation') score -= 500;
            }

            if (day > 1 && currentSchedule[day - 1]) {
                const prev = currentSchedule[day - 1];
                const workedPrev = (prev.day && (prev.day.main === doc.id || prev.day.backup === doc.id)) ||
                                   (prev.night && (prev.night.main === doc.id || prev.night.backup === doc.id));
                if (workedPrev) score -= 800; 
            }
            if (day > 2 && currentSchedule[day - 2]) {
                const prev2 = currentSchedule[day - 2];
                const workedPrev2 = (prev2.day && (prev2.day.main === doc.id || prev2.day.backup === doc.id)) ||
                                    (prev2.night && (prev2.night.main === doc.id || prev2.night.backup === doc.id));
                if (workedPrev2) score -= 200; 
            }

            if (day === 1) {
                const pYear = currentMonth === 1 ? currentYear - 1 : currentYear;
                const pMonth = currentMonth === 1 ? 12 : currentMonth - 1;
                const prevLastDay = getDaysInMonth(pYear, pMonth);
                
                const prev = prevMonthScheduleData[prevLastDay];
                if (prev) {
                    const workedPrev = (prev.day && (prev.day.main === doc.id || prev.day.backup === doc.id)) ||
                                       (prev.night && (prev.night.main === doc.id || prev.night.backup === doc.id));
                    if (workedPrev) score -= 800;
                }
                const prev2 = prevMonthScheduleData[prevLastDay - 1];
                if (prev2) {
                    const workedPrev2 = (prev2.day && (prev2.day.main === doc.id || prev2.day.backup === doc.id)) ||
                                        (prev2.night && (prev2.night.main === doc.id || prev2.night.backup === doc.id));
                    if (workedPrev2) score -= 200;
                }
            } else if (day === 2) {
                const pYear = currentMonth === 1 ? currentYear - 1 : currentYear;
                const pMonth = currentMonth === 1 ? 12 : currentMonth - 1;
                const prevLastDay = getDaysInMonth(pYear, pMonth);
                
                const prev2 = prevMonthScheduleData[prevLastDay];
                if (prev2) {
                    const workedPrev2 = (prev2.day && (prev2.day.main === doc.id || prev2.day.backup === doc.id)) ||
                                        (prev2.night && (prev2.night.main === doc.id || prev2.night.backup === doc.id));
                    if (workedPrev2) score -= 200;
                }
            }
            return score;
        }

        function sortCandidatesLocal(candidates, day, isHolidayShift, isBackup, currentCounts, currentSchedule) {
            let arr = [...candidates];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.sort((a, b) => {
                const scoreA = getCandidateScore(a, day, isHolidayShift, isBackup, currentCounts, currentSchedule);
                const scoreB = getCandidateScore(b, day, isHolidayShift, isBackup, currentCounts, currentSchedule);
                return scoreB - scoreA;
            });
        }

        function tryGenerate() {
            let currentSchedule = {};
            let currentCounts = {};
            doctors.forEach(d => currentCounts[d.id] = { shift: 0, backup: 0, weekdayShift: 0, holidayShift: 0 });
            let errors = 0;

            const assignShift = (day, shiftType, main, backup, isHoliday) => {
                if (!currentSchedule[day]) currentSchedule[day] = {};
                currentSchedule[day][shiftType] = { main: main.id, backup: backup ? backup.id : null };
                
                currentCounts[main.id].shift++;
                if (isHoliday) currentCounts[main.id].holidayShift++;
                else currentCounts[main.id].weekdayShift++;
                
                if (backup) {
                    currentCounts[backup.id].backup++;
                }
            };

            for (let day = 1; day <= daysInMonth; day++) {
                const isHol = isHolidayDay(day);
                currentSchedule[day] = {};

                if (isHol) {
                    let assignedFullDay = false;
                    
                    let availMainsFull = doctors.filter(d => 
                        canAssignLocal(d, day, 'day', false, currentSchedule, currentCounts) && 
                        canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts) &&
                        (d.limitShift - currentCounts[d.id].shift >= 2)
                    );
                    availMainsFull = sortCandidatesLocal(availMainsFull, day, true, false, currentCounts, currentSchedule);

                    for (let main of availMainsFull) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsFull = doctors.filter(d => 
                                d.id !== main.id &&
                                canAssignLocal(d, day, 'day', true, currentSchedule, currentCounts) && 
                                canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts) &&
                                (d.limitBackup - currentCounts[d.id].backup >= 2)
                            );
                            availBackupsFull = sortCandidatesLocal(availBackupsFull, day, true, true, currentCounts, currentSchedule);
                            
                            if (availBackupsFull.length > 0) {
                                let backup = availBackupsFull[0];
                                assignShift(day, 'day', main, backup, true);
                                assignShift(day, 'night', main, backup, true);
                                assignedFullDay = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'day', main, null, true);
                            assignShift(day, 'night', main, null, true);
                            assignedFullDay = true;
                            break;
                        }
                    }

                    if (assignedFullDay) continue;
                    
                    let availMainsDay = doctors.filter(d => canAssignLocal(d, day, 'day', false, currentSchedule, currentCounts));
                    availMainsDay = sortCandidatesLocal(availMainsDay, day, true, false, currentCounts, currentSchedule);
                    let assignedDay = false;
                    for (let main of availMainsDay) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsDay = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'day', true, currentSchedule, currentCounts));
                            availBackupsDay = sortCandidatesLocal(availBackupsDay, day, true, true, currentCounts, currentSchedule);
                            if (availBackupsDay.length > 0) {
                                assignShift(day, 'day', main, availBackupsDay[0], true);
                                assignedDay = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'day', main, null, true);
                            assignedDay = true;
                            break;
                        }
                    }
                    if (!assignedDay) {
                        currentSchedule[day]['day'] = { main: 'ERROR', backup: null };
                        errors++;
                    }

                    let availMainsNight = doctors.filter(d => canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts));
                    availMainsNight = sortCandidatesLocal(availMainsNight, day, true, false, currentCounts, currentSchedule);
                    let assignedNight = false;
                    for (let main of availMainsNight) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsNight = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts));
                            availBackupsNight = sortCandidatesLocal(availBackupsNight, day, true, true, currentCounts, currentSchedule);
                            if (availBackupsNight.length > 0) {
                                assignShift(day, 'night', main, availBackupsNight[0], true);
                                assignedNight = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'night', main, null, true);
                            assignedNight = true;
                            break;
                        }
                    }
                    if (!assignedNight) {
                        currentSchedule[day]['night'] = { main: 'ERROR', backup: null };
                        errors++;
                    }

                } else {
                    let availMains = doctors.filter(d => canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts));
                    availMains = sortCandidatesLocal(availMains, day, false, false, currentCounts, currentSchedule);
                    
                    let assigned = false;
                    for (let main of availMains) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackups = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts));
                            availBackups = sortCandidatesLocal(availBackups, day, false, true, currentCounts, currentSchedule);
                            
                            if (availBackups.length > 0) {
                                assignShift(day, 'night', main, availBackups[0], false);
                                assigned = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'night', main, null, false);
                            assigned = true;
                            break;
                        }
                    }
                    if (!assigned) {
                        currentSchedule[day]['night'] = { main: 'ERROR', backup: null };
                        errors++;
                    }
                }
            }

            return { schedule: currentSchedule, errors, finalCounts: currentCounts };
        }

        function generateSchedule() {
            const hasExistingSchedule = Object.keys(scheduleData).length > 0 && Object.values(scheduleData).some(day => Object.keys(day).length > 0);
            
            if (hasExistingSchedule) {
                if (!confirm(`すでに作成されたスケジュールが存在します。\n自動生成を実行すると、現在のスケジュールはすべて上書きされますがよろしいですか？`)) {
                    return; 
                }
            }

            pushToHistory(); // 履歴に保存

            const ATTEMPTS = 100;
            let bestSchedule = null;
            let minErrors = Infinity;
            let bestCounts = null;

            for (let i = 0; i < ATTEMPTS; i++) {
                let result = tryGenerate();
                if (result.errors < minErrors) {
                    minErrors = result.errors;
                    bestSchedule = result.schedule;
                    bestCounts = result.finalCounts;
                }
                if (minErrors === 0) break; 
            }

            scheduleData = bestSchedule;
            counts = bestCounts;
            saveMonthData();

            if (minErrors > 0) {
                showMessage(`<b>${minErrors} 枠</b> の割り当てができませんでした。「割当不可」の箇所を確認してください。`, true);
            } else {
                showMessage('スケジュールの自動生成が完了しました！');
            }
        }

        function exportToPDF() {
            if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
                showMessage('PDF出力ライブラリが読み込まれていません。ページをリロードしてください。', true);
                return;
            }
            
            showMessage('PDFを出力しています。しばらくお待ちください...');
            
            const element = document.getElementById('calendar-export-area');
            const header = document.getElementById('calendar-header');
            
            document.getElementById('export-month-display').textContent = `${currentYear}年 ${currentMonth}月`;
            header.classList.remove('hidden');

            element.classList.add('pdf-exporting');

            setTimeout(() => {
                html2canvas(element, { 
                    scale: 1.5, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    windowWidth: 2400 
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/jpeg', 0.6); 
                    const { jsPDF } = window.jspdf;
                    
                    const pdf = new jsPDF('portrait', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const margin = 5;
                    const availableWidth = pdfWidth - (margin * 2);
                    const availableHeight = pdfHeight - (margin * 2);
                    
                    const imgWidth = canvas.width;
                    const imgHeight = canvas.height;
                    
                    const ratio = Math.min(availableWidth / imgWidth, availableHeight / imgHeight);
                    
                    const finalWidth = imgWidth * ratio;
                    const finalHeight = imgHeight * ratio;
                    
                    const x = margin + (availableWidth - finalWidth) / 2;
                    const y = margin + (availableHeight - finalHeight) / 2;
                    
                    pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);
                    pdf.save(`消化器当番スケジュール_${currentYear}年${currentMonth}月.pdf`);
                    
                    header.classList.add('hidden');
                    element.classList.remove('pdf-exporting');
                    showMessage('PDFの出力が完了しました！');
                }).catch(err => {
                    console.error(err);
                    showMessage('PDF出力に失敗しました', true);
                    header.classList.add('hidden');
                    element.classList.remove('pdf-exporting');
                });
            }, 150);
        }

        function exportToExcel() {
            if (typeof html2canvas === 'undefined' || typeof ExcelJS === 'undefined') {
                showMessage('Excel出力ライブラリが読み込まれていません。ページをリロードしてください。', true);
                return;
            }
            
            showMessage('Excelを出力しています。しばらくお待ちください...');
            
            const element = document.getElementById('calendar-export-area');
            const header = document.getElementById('calendar-header');
            
            document.getElementById('export-month-display').textContent = `${currentYear}年 ${currentMonth}月`;
            header.classList.remove('hidden');

            element.classList.add('pdf-exporting');

            setTimeout(() => {
                html2canvas(element, { 
                    scale: 1.5, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    windowWidth: 2400 
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/jpeg', 0.8); 
                    
                    const workbook = new ExcelJS.Workbook();
                    const worksheet = workbook.addWorksheet('スケジュール', {
                        views: [{ showGridLines: false }] // Excelのセルの枠線を非表示にする
                    });
                    
                    const imageId = workbook.addImage({
                        base64: imgData,
                        extension: 'jpeg',
                    });
                    
                    // B2セルを起点に、Excel表示上で見やすいサイズ(幅・高さを半分)にリサイズして画像を配置
                    worksheet.addImage(imageId, {
                        tl: { col: 1, row: 1 }, 
                        ext: { width: canvas.width * 0.5, height: canvas.height * 0.5 } 
                    });
                    
                    workbook.xlsx.writeBuffer().then(buffer => {
                        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `消化器当番スケジュール_${currentYear}年${currentMonth}月.xlsx`;
                        a.click();
                        window.URL.revokeObjectURL(url);
                        
                        header.classList.add('hidden');
                        element.classList.remove('pdf-exporting');
                        showMessage('Excelの出力が完了しました！');
                    });

                }).catch(err => {
                    console.error(err);
                    showMessage('Excel出力に失敗しました', true);
                    header.classList.add('hidden');
                    element.classList.remove('pdf-exporting');
                });
            }, 150);
        }

        // --- 初期化 ---
        window.addEventListener('firebase-ready', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            
            let nextMonth = today.getMonth() + 2; 
            if (nextMonth > 12) {
                nextMonth -= 12;
                currentYear++;
            }
            currentMonth = nextMonth;
            
            listenDoctors();
            updateMonthDisplayAndData();
            
            switchTab('tab-schedule');
        });

    </script>
