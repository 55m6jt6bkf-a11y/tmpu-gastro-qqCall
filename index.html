        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // グローバルスコープにFirebaseの関数とdbインスタンスを公開（既存のロジックから呼ぶため）
        window.firebaseDb = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;

        // Firebase準備完了イベントを発火
        window.dispatchEvent(new Event('firebase-ready'));

            { id: 'doc_13', name: '田島', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_14', name: '巽', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_15', name: '齋藤', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_16', name: '八子', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_17', name: '山田(陽)', type: DOCTOR_TYPES.NEEDS_BACKUP, limitShift: 4, limitBackup: 0 },
            { id: 'doc_18', name: '福士', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
            { id: 'doc_19', name: '小岩井', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
            { id: 'doc_20', name: '吉野', type: DOCTOR_TYPES.BACKUP_ONLY, limitShift: 0, limitBackup: 4 },
        ];

        let doctors = [];
        let currentYear = 2026;
        let currentMonth = 9; 
        let daysInMonth = 30;
        
        let customHolidays = []; 
        let unavailability = {}; 
        let scheduleData = {};
        let counts = {};
        
        let toastTimeout;
        let unsubscribeMonth = null;
        let unsubscribeDoctors = null;

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function getDayOfWeek(year, month, day) {
            const d = new Date(year, month - 1, day);
            return ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
        }

        function isHolidayDay(day) {
            const d = new Date(currentYear, currentMonth - 1, day);
            const dow = d.getDay();
            if (dow === 0 || dow === 6) return true;
            if (typeof JapaneseHolidays !== 'undefined' && JapaneseHolidays.isHoliday(d)) return true;
            if (customHolidays.includes(day)) return true;
            return false;
        }

        function getTypeLabel(type) {
            if (type === DOCTOR_TYPES.SOLO_BACKUP) return '<span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] sm:text-xs font-medium border border-indigo-100 whitespace-nowrap">単独・Backup可</span>';
            if (type === DOCTOR_TYPES.NEEDS_BACKUP) return '<span class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded-md text-[10px] sm:text-xs font-medium border border-emerald-100 whitespace-nowrap">要Backup</span>';
            if (type === DOCTOR_TYPES.BACKUP_ONLY) return '<span class="px-2 py-1 bg-amber-50 text-amber-700 rounded-md text-[10px] sm:text-xs font-medium border border-amber-100 whitespace-nowrap">Backupのみ</span>';
            return '';
        }

        function getDefaultLimits(type) {
            return {
                shift: (type === DOCTOR_TYPES.BACKUP_ONLY) ? 0 : 4,
                backup: (type === DOCTOR_TYPES.NEEDS_BACKUP) ? 0 : 4,
            };
        }

        function showMessage(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const messageEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            clearTimeout(toastTimeout);
            messageEl.innerHTML = msg;
            
            if (isError) {
                container.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 flex items-center shadow-lg rounded-full px-4 sm:px-6 py-2.5 sm:py-3 font-medium text-xs sm:text-sm backdrop-blur-md bg-rose-50 text-rose-700 border border-rose-200 toast-enter w-11/12 max-w-md';
                iconEl.innerHTML = '<svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            } else {
                container.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 flex items-center shadow-lg rounded-full px-4 sm:px-6 py-2.5 sm:py-3 font-medium text-xs sm:text-sm backdrop-blur-md bg-emerald-50 text-emerald-800 border border-emerald-200 toast-enter w-11/12 max-w-md';
                iconEl.innerHTML = '<svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }

            toastTimeout = setTimeout(() => {
                container.classList.remove('toast-enter');
                container.classList.add('toast-leave');
            }, 6000);
        }
        
        function generateId() {
            return 'doc_' + Math.random().toString(36).substr(2, 9);
        }

        function saveDoctors() {
            if(!window.firebaseSetDoc) return;
            const docRef = window.firebaseDoc(window.firebaseDb, 'settings', 'doctors');
            window.firebaseSetDoc(docRef, { list: doctors })
                .catch(err => console.error("Error saving doctors:", err));
        }

        function listenDoctors() {
            if(!window.firebaseOnSnapshot) return;
            if (unsubscribeDoctors) unsubscribeDoctors();
            
            const docRef = window.firebaseDoc(window.firebaseDb, 'settings', 'doctors');
            unsubscribeDoctors = window.firebaseOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    doctors = docSnap.data().list || [];
                    doctors.forEach(d => {
                        if (d.limitShift === undefined) d.limitShift = getDefaultLimits(d.type).shift;
                        if (d.limitBackup === undefined) d.limitBackup = getDefaultLimits(d.type).backup;
                    });
                } else {
                    doctors = JSON.parse(JSON.stringify(defaultDoctorsData));
                    saveDoctors();
                }
                renderDoctorsTable();
                renderUnavailabilityTable();
                renderSummary();
            }, err => console.error("Error listening doctors:", err));
        }

        function getMonthDataKey() {
            return `schedule_${currentYear}_${currentMonth}`;
        }

        function saveMonthData() {
            if(!window.firebaseSetDoc) return;
            const docRef = window.firebaseDoc(window.firebaseDb, 'monthly_schedules', getMonthDataKey());
            const data = {
                unavailability,
                customHolidays,
                scheduleData,
                counts
            };
            window.firebaseSetDoc(docRef, data)
                .catch(err => console.error("Error saving month data:", err));
        }

        function listenMonthData() {
            if(!window.firebaseOnSnapshot) return;
            if (unsubscribeMonth) unsubscribeMonth();
            
            unavailability = {};
            customHolidays = [];
            scheduleData = {};
            counts = {};
            
            const docRef = window.firebaseDoc(window.firebaseDb, 'monthly_schedules', getMonthDataKey());
            unsubscribeMonth = window.firebaseOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    unavailability = data.unavailability || {};
                    customHolidays = data.customHolidays || [];
                    scheduleData = data.scheduleData || {};
                    counts = data.counts || {};
                }
                renderCustomHolidays();
                renderUnavailabilityTable();
                renderCalendar();
                renderSummary();
            }, err => console.error("Error listening month data:", err));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
                el.classList.add('text-slate-500', 'hover:text-slate-700', 'hover:bg-slate-50/50');
            });
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('text-slate-500', 'hover:text-slate-700', 'hover:bg-slate-50/50');
            activeBtn.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
        }

        function updateMonthDisplayAndData() {
            document.getElementById('current-month-display').textContent = `${currentYear}年 ${currentMonth}月`;
            document.getElementById('reset-btn-text').textContent = `${currentMonth}月をリセット`;
            daysInMonth = getDaysInMonth(currentYear, currentMonth);
            listenMonthData();
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            updateMonthDisplayAndData();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            updateMonthDisplayAndData();
        }
        
        function toggleCustomHoliday(day) {
            const idx = customHolidays.indexOf(day);
            if (idx > -1) {
                customHolidays.splice(idx, 1);
            } else {
                customHolidays.push(day);
            }
            saveMonthData();
        }

        function updateUnavail(docId, day, val) {
            if (!unavailability[docId]) unavailability[docId] = {};
            if (val === '') {
                delete unavailability[docId][day];
            } else {
                unavailability[docId][day] = val;
            }
            saveMonthData();
        }

        function updateDoctorLimit(docId, field, val) {
            const doc = doctors.find(d => d.id === docId);
            if (doc) {
                doc[field === 'shift' ? 'limitShift' : 'limitBackup'] = parseInt(val, 10) || 0;
                saveDoctors();
            }
        }
        
        function addDoctor() {
            const nameInput = document.getElementById('new-doc-name');
            const typeInput = document.getElementById('new-doc-type');
            const name = nameInput.value.trim();
            if (!name) {
                showMessage("氏名を入力してください", true);
                return;
            }
            
            const newDoc = {
                id: generateId(),
                name: name,
                type: typeInput.value,
                limitShift: getDefaultLimits(typeInput.value).shift,
                limitBackup: getDefaultLimits(typeInput.value).backup
            };
            
            doctors.push(newDoc);
            saveDoctors();
            
            nameInput.value = '';
            showMessage(`「${name}」を追加しました。`);
        }
        
        function removeDoctor(docId) {
            const doc = doctors.find(d => d.id === docId);
            if (!doc) return;
            if (!confirm(`「${doc.name}」を削除してもよろしいですか？`)) return;
            
            doctors = doctors.filter(d => d.id !== docId);
            saveDoctors();
            
            delete unavailability[docId];
            saveMonthData();
        }
        
        function resetCurrentMonthSchedule() {
            if (Object.keys(scheduleData).length === 0) {
                showMessage('リセットするスケジュールがありません。');
                return;
            }
            
            if (!confirm(`【警告】\n${currentYear}年${currentMonth}月の「スケジュール割当」をすべて白紙に戻しますか？\n※除外日や休診日設定はそのまま残ります。`)) {
                return;
            }
            
            scheduleData = {};
            counts = {};
            
            saveMonthData();
            showMessage(`${currentYear}年${currentMonth}月のスケジュールをリセットしました。`);
        }

        function renderDoctorsTable() {
            const tbody = document.getElementById('doctors-tbody');
            let html = '';
            doctors.forEach(doc => {
                let shiftOptions = '';
                let backupOptions = '';
                for(let i=0; i<=10; i++) {
                    shiftOptions += `<option value="${i}" ${doc.limitShift === i ? 'selected' : ''}>${i}</option>`;
                    backupOptions += `<option value="${i}" ${doc.limitBackup === i ? 'selected' : ''}>${i}</option>`;
                }

                html += `<tr class="bg-white hover:bg-slate-50/80 transition-colors group">
                    <td class="border-b border-slate-100 py-2 sm:py-3 px-3 sm:px-5 font-medium text-slate-700 whitespace-nowrap">${doc.name}</td>
                    <td class="border-b border-slate-100 py-2 sm:py-3 px-3 sm:px-5">${getTypeLabel(doc.type)}</td>
                    <td class="border-b border-slate-100 py-2 sm:py-3 px-2 sm:px-5 text-center">
                        <select class="border border-slate-200 rounded-md p-1 sm:p-1.5 w-12 sm:w-16 text-center focus:ring-2 focus:ring-indigo-400 focus:outline-none shadow-sm transition-all text-xs sm:text-sm bg-white" 
                            onchange="updateDoctorLimit('${doc.id}', 'shift', this.value)" 
                            ${doc.type === DOCTOR_TYPES.BACKUP_ONLY ? 'disabled class="bg-slate-50 text-slate-400 border border-slate-200 rounded-md p-1 sm:p-1.5 w-12 sm:w-16 text-center shadow-none text-xs sm:text-sm"' : ''}>
                            ${shiftOptions}
                        </select>
                    </td>
                    <td class="border-b border-slate-100 py-2 sm:py-3 px-2 sm:px-5 text-center">
                        <select class="border border-slate-200 rounded-md p-1 sm:p-1.5 w-12 sm:w-16 text-center focus:ring-2 focus:ring-indigo-400 focus:outline-none shadow-sm transition-all text-xs sm:text-sm bg-white" 
                            onchange="updateDoctorLimit('${doc.id}', 'backup', this.value)" 
                            ${doc.type === DOCTOR_TYPES.NEEDS_BACKUP ? 'disabled class="bg-slate-50 text-slate-400 border border-slate-200 rounded-md p-1 sm:p-1.5 w-12 sm:w-16 text-center shadow-none text-xs sm:text-sm"' : ''}>
                            ${backupOptions}
                        </select>
                    </td>
                    <td class="border-b border-slate-100 py-2 sm:py-3 px-3 sm:px-5 text-center">
                        <button onclick="removeDoctor('${doc.id}')" class="text-rose-500 hover:text-white hover:bg-rose-500 p-1.5 sm:p-2 rounded-lg transition-all opacity-100 lg:opacity-0 lg:group-hover:opacity-100 focus:opacity-100" title="削除">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        
        function renderCustomHolidays() {
            const container = document.getElementById('custom-holidays-container');
            let html = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(currentYear, currentMonth - 1, d);
                const dow = dateObj.getDay();
                let isAutoHoliday = false;
                let holidayName = '';
                
                if (dow === 0 || dow === 6) {
                    isAutoHoliday = true;
                    holidayName = dow === 0 ? '日' : '土';
                }
                
                if (typeof JapaneseHolidays !== 'undefined') {
                    const hName = JapaneseHolidays.isHoliday(dateObj);
                    if (hName) {
                        isAutoHoliday = true;
                        holidayName = hName;
                    }
                }
                
                const isChecked = customHolidays.includes(d);
                
                if (isAutoHoliday) {
                    html += `<label class="inline-flex items-center justify-center bg-rose-50 border border-rose-100 px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-xs text-rose-700 opacity-60 cursor-not-allowed font-medium select-none whitespace-nowrap" title="自動的に休日扱いになります (${holidayName})">
                        ${d}日
                    </label>`;
                } else {
                    html += `<label class="inline-flex items-center justify-center ${isChecked ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300'} border px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-xs cursor-pointer transition-all font-medium select-none shadow-sm whitespace-nowrap">
                        <input type="checkbox" onchange="toggleCustomHoliday(${d})" ${isChecked ? 'checked' : ''} class="hidden"> 
                        ${d}日
                    </label>`;
                }
            }
            container.innerHTML = html;
        }

        function renderUnavailabilityTable() {
            const thead = document.getElementById('unavail-thead');
            const tbody = document.getElementById('unavail-tbody');
            
            let headHtml = `<th class="sticky-cross p-2 sm:p-3 w-20 sm:w-28 border-b border-r border-slate-200 bg-slate-50 text-left pl-2 sm:pl-4 font-semibold text-[10px] sm:text-xs">氏名</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(currentYear, currentMonth - 1, d);
                const dowNum = dateObj.getDay();
                const isHol = isHolidayDay(d);
                
                let textClass = 'text-slate-600';
                if (dowNum === 6) textClass = 'text-indigo-600'; 
                
                let isPublicHoliday = false;
                if (typeof JapaneseHolidays !== 'undefined' && JapaneseHolidays.isHoliday(dateObj)) isPublicHoliday = true;
                if (customHolidays.includes(d)) isPublicHoliday = true;
                
                if (dowNum === 0 || isPublicHoliday) textClass = 'text-rose-600';
                
                const bgClass = isHol ? 'bg-rose-50/50' : 'bg-slate-50';

                headHtml += `<th class="sticky-head p-1 sm:p-1.5 min-w-[45px] sm:min-w-[60px] border-b border-r border-slate-200 ${bgClass}">
                    <div class="flex flex-col items-center justify-center leading-tight">
                        <span class="font-bold ${textClass} text-xs sm:text-sm">${d}</span>
                        <span class="text-[9px] sm:text-[10px] font-medium ${textClass} opacity-80">${getDayOfWeek(currentYear, currentMonth, d)}</span>
                    </div>
                </th>`;
            }
            thead.innerHTML = headHtml;

            let bodyHtml = '';
            doctors.forEach(doc => {
                bodyHtml += `<tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="sticky-col p-1.5 sm:p-2 pl-2 sm:pl-4 border-b border-r border-slate-100 text-left font-medium text-slate-700 bg-white shadow-[1px_0_0_#f1f5f9] whitespace-nowrap text-[10px] sm:text-xs">${doc.name}</td>`;
                for (let d = 1; d <= daysInMonth; d++) {
                    const isHol = isHolidayDay(d);
                    const val = unavailability[doc.id]?.[d] || '';
                    
                    let cellBg = isHol ? 'bg-rose-50/20' : 'bg-white';
                    let textStyle = 'text-slate-700';
                    
                    if (val) {
                        if (['vacation'].includes(val)) {
                            cellBg = 'bg-rose-50'; textStyle = 'text-rose-700 font-medium';
                        } else if (['unavailable', 'day_unavailable', 'night_unavailable'].includes(val)) {
                            cellBg = 'bg-amber-50'; textStyle = 'text-amber-700 font-medium';
                        } else {
                            cellBg = 'bg-indigo-50'; textStyle = 'text-indigo-700 font-medium';
                        }
                    }

                    let options = '';
                    REASONS.forEach(r => {
                        if (!isHol && ['day_unavailable', 'night_unavailable', 'er_day', 'icu_day', 'admin_day'].includes(r.val)) {
                            options += `<option value="${r.val}" disabled class="text-slate-300 bg-slate-50">${r.label}</option>`;
                        } else {
                            options += `<option value="${r.val}" ${val === r.val ? 'selected' : ''} class="text-slate-700">${r.label}</option>`;
                        }
                    });

                    bodyHtml += `<td class="border-b border-r border-slate-100 p-0.5 sm:p-1 ${cellBg}">
                        <select class="compact text-[9px] sm:text-[11px] h-full py-1 sm:py-1.5 ${textStyle}" onchange="updateUnavail('${doc.id}', ${d}, this.value)">
                            ${options}
                        </select>
                    </td>`;
                }
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        function getDoctorNameById(id) {
            if (id === 'ERROR') return '不可';
            const doc = doctors.find(d => d.id === id);
            return doc ? doc.name : '不明';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if (!grid) return;
            let html = '';
            
            const dows = [
                { label: '日', class: 'text-rose-600' },
                { label: '月', class: 'text-slate-500' },
                { label: '火', class: 'text-slate-500' },
                { label: '水', class: 'text-slate-500' },
                { label: '木', class: 'text-slate-500' },
                { label: '金', class: 'text-slate-500' },
                { label: '土', class: 'text-indigo-600' }
            ];
            
            // Header
            html += `<div class="hidden md:contents desktop-only-contents">`;
            dows.forEach(dow => {
                html += `<div class="text-center py-2 sm:py-3 bg-white ${dow.class} font-semibold text-[10px] sm:text-xs tracking-widest border-b border-slate-100">${dow.label}</div>`;
            });
            html += `</div>`;

            const firstDay = new Date(currentYear, currentMonth - 1, 1);
            const startDow = firstDay.getDay();

            for (let i = 0; i < startDow; i++) {
                html += `<div class="hidden md:block desktop-only bg-slate-50/50 min-h-[90px] sm:min-h-[120px]"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(currentYear, currentMonth - 1, d);
                const dowNum = dateObj.getDay();
                const isHol = isHolidayDay(d);
                
                let holidayName = '';
                if (typeof JapaneseHolidays !== 'undefined') {
                    const hName = JapaneseHolidays.isHoliday(dateObj);
                    if (hName) holidayName = hName;
                }
                if (customHolidays.includes(d)) {
                    holidayName = holidayName ? holidayName + ' (休)' : '休診日';
                }
                
                const bgClass = isHol ? 'bg-rose-50/30' : 'bg-white';
                
                let textClass = 'text-slate-700';
                if (dowNum === 6) textClass = 'text-indigo-600';
                if (dowNum === 0 || holidayName) textClass = 'text-rose-600';
                
                let shiftHtml = '';
                if (scheduleData[d]) {
                    const sunIcon = `<svg class="w-3.5 h-3.5 mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`;
                    const moonIcon = `<svg class="w-3.5 h-3.5 mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;

                    if (isHol && scheduleData[d].day) {
                        const sDay = scheduleData[d].day;
                        if (sDay.main === 'ERROR') {
                            shiftHtml += `<div class="mb-1.5 p-1.5 bg-rose-50 border border-rose-200 rounded-lg text-xs md:text-[11px] text-rose-600 font-bold text-center flex items-center justify-center shadow-sm">${sunIcon} 割当不可</div>`;
                        } else {
                            shiftHtml += `<div class="mb-1.5 p-2 md:p-1.5 bg-amber-50 border border-amber-200/60 rounded-lg shadow-sm">
                                <div class="flex items-center text-amber-700 font-semibold text-sm md:text-[12px] whitespace-nowrap overflow-hidden">${sunIcon} <span class="md:text-[13px] ml-0.5 truncate doc-main-name">${getDoctorNameById(sDay.main)}</span></div>
                                ${sDay.backup ? `<div class="text-amber-600/80 mt-1 md:mt-0.5 text-xs md:text-[10px] ml-5 md:ml-4.5 font-medium truncate doc-backup-name">B: ${getDoctorNameById(sDay.backup)}</div>` : ''}
                            </div>`;
                        }
                    }
                    if (scheduleData[d].night) {
                        const sNight = scheduleData[d].night;
                        if (sNight.main === 'ERROR') {
                            shiftHtml += `<div class="p-1.5 bg-rose-50 border border-rose-200 rounded-lg text-xs md:text-[11px] text-rose-600 font-bold text-center flex items-center justify-center shadow-sm">${moonIcon} 割当不可</div>`;
                        } else {
                            shiftHtml += `<div class="p-2 md:p-1.5 bg-indigo-50 border border-indigo-200/60 rounded-lg shadow-sm">
                                <div class="flex items-center text-indigo-700 font-semibold text-sm md:text-[12px] whitespace-nowrap overflow-hidden">${moonIcon} <span class="md:text-[13px] ml-0.5 truncate doc-main-name">${getDoctorNameById(sNight.main)}</span></div>
                                ${sNight.backup ? `<div class="text-indigo-600/80 mt-1 md:mt-0.5 text-xs md:text-[10px] ml-5 md:ml-4.5 font-medium truncate doc-backup-name">B: ${getDoctorNameById(sNight.backup)}</div>` : ''}
                            </div>`;
                        }
                    }
                }
                
                let otherDutiesHtml = '';
                const dutyMap = {
                    'er_day': { short: '救日', color: 'text-blue-600', bg: 'bg-blue-50' },
                    'er_night': { short: '救夜', color: 'text-indigo-600', bg: 'bg-indigo-50' },
                    'icu_day': { short: 'ICU日', color: 'text-teal-600', bg: 'bg-teal-50' },
                    'icu_night': { short: 'ICU夜', color: 'text-teal-600', bg: 'bg-teal-50' },
                    'admin_day': { short: '管日', color: 'text-slate-600', bg: 'bg-slate-100' },
                    'admin_night': { short: '管夜', color: 'text-slate-600', bg: 'bg-slate-100' }
                };
                let dailyDuties = [];
                doctors.forEach(doc => {
                    const reason = unavailability[doc.id]?.[d];
                    if (reason && dutyMap[reason]) {
                        dailyDuties.push({ name: doc.name, duty: dutyMap[reason] });
                    }
                });
                
                if (dailyDuties.length > 0) {
                    otherDutiesHtml = '<div class="mt-2 flex flex-col gap-1.5 md:gap-1">';
                    dailyDuties.forEach(item => {
                        otherDutiesHtml += `<div class="text-xs md:text-[10px] ${item.duty.color} ${item.duty.bg} px-2 md:px-1.5 py-1 md:py-0.5 rounded truncate font-medium flex justify-between"><span>${item.duty.short}</span><span class="truncate ml-2">${item.name}</span></div>`;
                    });
                    otherDutiesHtml += '</div>';
                }
                
                html += `<div class="${bgClass} p-3 md:p-1.5 lg:p-3 min-h-[auto] md:min-h-[120px] hover:bg-slate-50 transition-colors flex flex-col border-b border-slate-200 md:border-transparent overflow-hidden">
                    <div class="flex flex-row md:flex-col xl:flex-row justify-between items-center md:items-start mb-3 md:mb-2">
                        <div class="flex items-baseline gap-2 md:gap-0">
                            <span class="font-bold ${textClass} text-base md:text-sm">${d}</span>
                            <span class="md:hidden mobile-only text-xs font-bold ${textClass}">${getDayOfWeek(currentYear, currentMonth, d)}</span>
                        </div>
                        ${holidayName ? `<span class="text-xs md:text-[10px] text-rose-500 font-medium text-left xl:text-right max-w-full leading-tight truncate md:mt-0.5">${holidayName}</span>` : ''}
                    </div>
                    <div class="flex-1 flex flex-col justify-end gap-1.5 md:gap-1 w-full">
                        ${shiftHtml}
                        ${otherDutiesHtml}
                    </div>
                </div>`;
            }

            const lastDay = new Date(currentYear, currentMonth - 1, daysInMonth);
            const endDow = lastDay.getDay();
            for (let i = endDow + 1; i <= 6; i++) {
                html += `<div class="hidden md:block desktop-only bg-slate-50/50 min-h-[90px] sm:min-h-[120px]"></div>`;
            }

            grid.innerHTML = html;
        }

        function renderSummary() {
            const tbody = document.getElementById('summary-tbody');
            let html = '';
            
            if (Object.keys(counts).length === 0) {
                doctors.forEach(d => counts[d.id] = { shift: 0, backup: 0 });
            }

            doctors.forEach(doc => {
                const c = counts[doc.id] || { shift: 0, backup: 0 };
                const total = c.shift + c.backup;
                
                html += `<tr class="bg-white hover:bg-slate-50/80 transition-colors">
                    <td class="border-b border-slate-100 p-2 sm:p-3 px-3 sm:px-4 font-medium text-slate-700 whitespace-nowrap text-[11px] sm:text-sm">${doc.name}</td>
                    <td class="border-b border-slate-100 p-2 sm:p-3 px-1.5 sm:px-2 text-center">
                        <span class="font-bold text-slate-800 text-xs sm:text-sm">${c.shift}</span>
                        <span class="text-[9px] sm:text-[11px] text-slate-400 font-medium ml-0.5">/ ${doc.limitShift}</span>
                    </td>
                    <td class="border-b border-slate-100 p-2 sm:p-3 px-1.5 sm:px-2 text-center">
                        <span class="font-bold text-slate-800 text-xs sm:text-sm">${c.backup}</span>
                        <span class="text-[9px] sm:text-[11px] text-slate-400 font-medium ml-0.5">/ ${doc.limitBackup}</span>
                    </td>
                    <td class="border-b border-slate-100 p-2 sm:p-3 px-1.5 sm:px-2 text-center font-bold text-indigo-600 text-sm sm:text-[15px]">${total}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function canAssignLocal(doctor, day, type, isBackup, currentSchedule, currentCounts) {
            
            if (isBackup) {
                if (currentCounts[doctor.id].backup >= doctor.limitBackup) return false;
            } else {
                if (currentCounts[doctor.id].shift >= doctor.limitShift) return false;
            }

            if (isBackup && doctor.type === DOCTOR_TYPES.NEEDS_BACKUP) return false;
            if (!isBackup && doctor.type === DOCTOR_TYPES.BACKUP_ONLY) return false;

            const reason = unavailability[doctor.id]?.[day];
            if (reason) {
                if (['er_day', 'vacation', 'icu_day', 'icu_night', 'admin_day', 'admin_night', 'unavailable'].includes(reason)) return false;
                if (reason === 'er_night') return false;
                if (reason === 'day_unavailable' && type === 'day') return false;
                if (reason === 'night_unavailable' && type === 'night') return false;
            }
            if (day > 1 && unavailability[doctor.id]?.[day - 1] === 'er_night') return false;

            if (day > 1 && currentSchedule[day - 1]?.night) {
                const prevN = currentSchedule[day - 1].night;
                if (prevN.main === doctor.id || prevN.backup === doctor.id) return false;
            }

            if (currentSchedule[day]) {
                const otherType = type === 'day' ? 'night' : 'day';
                if (currentSchedule[day][otherType]) {
                    const os = currentSchedule[day][otherType];
                    if (os.main === doctor.id || os.backup === doctor.id) return false;
                }
            }

            return true;
        }

        function sortCandidatesLocal(candidates, isHolidayShift, isBackup, currentCounts) {
            let arr = [...candidates];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.sort((a, b) => {
                // 要Backupを1st Callとして最優先でアサインするための処理
                if (!isBackup) {
                    const aNeeds = a.type === DOCTOR_TYPES.NEEDS_BACKUP ? 1 : 0;
                    const bNeeds = b.type === DOCTOR_TYPES.NEEDS_BACKUP ? 1 : 0;
                    if (aNeeds !== bNeeds) return bNeeds - aNeeds; // 1(要Backup)を前へ
                }

                const aRemain = isBackup ? (a.limitBackup - currentCounts[a.id].backup) : (a.limitShift - currentCounts[a.id].shift);
                const bRemain = isBackup ? (b.limitBackup - currentCounts[b.id].backup) : (b.limitShift - currentCounts[b.id].shift);
                
                if (aRemain !== bRemain) return bRemain - aRemain;

                if (!isBackup) {
                    const aTypeShift = isHolidayShift ? currentCounts[a.id].holidayShift : currentCounts[a.id].weekdayShift;
                    const bTypeShift = isHolidayShift ? currentCounts[b.id].holidayShift : currentCounts[b.id].weekdayShift;
                    return aTypeShift - bTypeShift;
                }
                return 0;
            });
        }

        function tryGenerate() {
            let currentSchedule = {};
            let currentCounts = {};
            doctors.forEach(d => currentCounts[d.id] = { shift: 0, backup: 0, weekdayShift: 0, holidayShift: 0 });
            let errors = 0;

            const assignShift = (day, shiftType, main, backup, isHoliday) => {
                if (!currentSchedule[day]) currentSchedule[day] = {};
                currentSchedule[day][shiftType] = { main: main.id, backup: backup ? backup.id : null };
                
                currentCounts[main.id].shift++;
                if (isHoliday) currentCounts[main.id].holidayShift++;
                else currentCounts[main.id].weekdayShift++;
                
                if (backup) {
                    currentCounts[backup.id].backup++;
                }
            };

            for (let day = 1; day <= daysInMonth; day++) {
                const isHol = isHolidayDay(day);
                currentSchedule[day] = {};

                if (isHol) {
                    let assignedFullDay = false;
                    
                    let availMainsFull = doctors.filter(d => 
                        canAssignLocal(d, day, 'day', false, currentSchedule, currentCounts) && 
                        canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts) &&
                        (d.limitShift - currentCounts[d.id].shift >= 2)
                    );
                    availMainsFull = sortCandidatesLocal(availMainsFull, true, false, currentCounts);

                    for (let main of availMainsFull) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsFull = doctors.filter(d => 
                                d.id !== main.id &&
                                canAssignLocal(d, day, 'day', true, currentSchedule, currentCounts) && 
                                canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts) &&
                                (d.limitBackup - currentCounts[d.id].backup >= 2)
                            );
                            availBackupsFull = sortCandidatesLocal(availBackupsFull, true, true, currentCounts);
                            
                            if (availBackupsFull.length > 0) {
                                let backup = availBackupsFull[0];
                                assignShift(day, 'day', main, backup, true);
                                assignShift(day, 'night', main, backup, true);
                                assignedFullDay = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'day', main, null, true);
                            assignShift(day, 'night', main, null, true);
                            assignedFullDay = true;
                            break;
                        }
                    }

                    if (assignedFullDay) continue;
                    
                    // --- 休日 昼のみの割当 ---
                    let availMainsDay = doctors.filter(d => canAssignLocal(d, day, 'day', false, currentSchedule, currentCounts));
                    availMainsDay = sortCandidatesLocal(availMainsDay, true, false, currentCounts);
                    let assignedDay = false;
                    // 要Backupの人がバックアップ不在でエラーにならないよう、ループして次の候補を探す
                    for (let main of availMainsDay) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsDay = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'day', true, currentSchedule, currentCounts));
                            availBackupsDay = sortCandidatesLocal(availBackupsDay, true, true, currentCounts);
                            if (availBackupsDay.length > 0) {
                                assignShift(day, 'day', main, availBackupsDay[0], true);
                                assignedDay = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'day', main, null, true);
                            assignedDay = true;
                            break;
                        }
                    }
                    if (!assignedDay) {
                        currentSchedule[day]['day'] = { main: 'ERROR', backup: null };
                        errors++;
                    }

                    // --- 休日 夜のみの割当 ---
                    let availMainsNight = doctors.filter(d => canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts));
                    availMainsNight = sortCandidatesLocal(availMainsNight, true, false, currentCounts);
                    let assignedNight = false;
                    for (let main of availMainsNight) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackupsNight = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts));
                            availBackupsNight = sortCandidatesLocal(availBackupsNight, true, true, currentCounts);
                            if (availBackupsNight.length > 0) {
                                assignShift(day, 'night', main, availBackupsNight[0], true);
                                assignedNight = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'night', main, null, true);
                            assignedNight = true;
                            break;
                        }
                    }
                    if (!assignedNight) {
                        currentSchedule[day]['night'] = { main: 'ERROR', backup: null };
                        errors++;
                    }

                } else {
                    // --- 平日 夜のみの割当 ---
                    let availMains = doctors.filter(d => canAssignLocal(d, day, 'night', false, currentSchedule, currentCounts));
                    availMains = sortCandidatesLocal(availMains, false, false, currentCounts);
                    
                    let assigned = false;
                    for (let main of availMains) {
                        if (main.type === DOCTOR_TYPES.NEEDS_BACKUP) {
                            let availBackups = doctors.filter(d => d.id !== main.id && canAssignLocal(d, day, 'night', true, currentSchedule, currentCounts));
                            availBackups = sortCandidatesLocal(availBackups, false, true, currentCounts);
                            
                            if (availBackups.length > 0) {
                                assignShift(day, 'night', main, availBackups[0], false);
                                assigned = true;
                                break;
                            }
                        } else {
                            assignShift(day, 'night', main, null, false);
                            assigned = true;
                            break;
                        }
                    }
                    if (!assigned) {
                        currentSchedule[day]['night'] = { main: 'ERROR', backup: null };
                        errors++;
                    }
                }
            }

            return { schedule: currentSchedule, errors, finalCounts: currentCounts };
        }

        function generateSchedule() {
            const ATTEMPTS = 100;
            let bestSchedule = null;
            let minErrors = Infinity;
            let bestCounts = null;

            for (let i = 0; i < ATTEMPTS; i++) {
                let result = tryGenerate();
                if (result.errors < minErrors) {
                    minErrors = result.errors;
                    bestSchedule = result.schedule;
                    bestCounts = result.finalCounts;
                }
                if (minErrors === 0) break; 
            }

            scheduleData = bestSchedule;
            counts = bestCounts;
            saveMonthData();

            if (minErrors > 0) {
                showMessage(`<b>${minErrors} 枠</b> の割り当てができませんでした。「割当不可」の箇所を確認してください。`, true);
            } else {
                showMessage('スケジュールの自動生成が完了しました！');
            }
        }

        function exportToPDF() {
            if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
                showMessage('PDF出力ライブラリが読み込まれていません。ページをリロードしてください。', true);
                return;
            }
            
            showMessage('PDFを出力しています。しばらくお待ちください...');
            
            const element = document.getElementById('calendar-export-area');
            const header = document.getElementById('calendar-header');
            
            document.getElementById('export-month-display').textContent = `${currentYear}年 ${currentMonth}月`;
            header.classList.remove('hidden');

            element.classList.add('pdf-exporting');

            setTimeout(() => {
                html2canvas(element, { 
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    windowWidth: 1400 // PDF出力時に仮想的に十分な幅を持たせる
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const { jsPDF } = window.jspdf;
                    
                    const pdf = new jsPDF('landscape', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const margin = 5;
                    const availableWidth = pdfWidth - (margin * 2);
                    const availableHeight = pdfHeight - (margin * 2);
                    
                    const imgWidth = canvas.width;
                    const imgHeight = canvas.height;
                    
                    const ratio = Math.min(availableWidth / imgWidth, availableHeight / imgHeight);
                    
                    const finalWidth = imgWidth * ratio;
                    const finalHeight = imgHeight * ratio;
                    
                    const x = margin + (availableWidth - finalWidth) / 2;
                    const y = margin + (availableHeight - finalHeight) / 2;
                    
                    pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);
                    pdf.save(`消化器当番スケジュール_${currentYear}年${currentMonth}月.pdf`);
                    
                    header.classList.add('hidden');
                    element.classList.remove('pdf-exporting');
                    showMessage('PDFの出力が完了しました！');
                }).catch(err => {
                    console.error(err);
                    showMessage('PDF出力に失敗しました', true);
                    header.classList.add('hidden');
                    element.classList.remove('pdf-exporting');
                });
            }, 150);
        }

        // --- 初期化 ---
        window.addEventListener('firebase-ready', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth() + 1;
            
            listenDoctors();
            updateMonthDisplayAndData();
            
            switchTab('tab-schedule');
        });

    </script>
